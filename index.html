<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kalendarz Pracy</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#6c5ce7">
    <link rel="apple-touch-icon" href="icon.svg">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="main-header" style="display: flex; justify-content: space-between; padding: 10px 15px; align-items: center; background: var(--bg-color);">
        <button id="toggle-view-btn" class="header-btn">Rok</button>
        
        <div id="month-selector" class="selector-group" style="display: flex; align-items: center; gap: 10px;">
            <button id="prev-month" class="nav-btn">&lt;</button>
            <h2 id="current-month-label" class="date-label">Wrzesień 2026</h2>
            <button id="next-month" class="nav-btn">&gt;</button>
        </div>

        <div id="year-selector" class="selector-group hidden" style="display: flex; align-items: center; gap: 10px;">
            <button id="prev-year" class="nav-btn">&lt;</button>
            <h2 id="current-year-label" class="date-label">2026</h2>
            <button id="next-year" class="nav-btn">&gt;</button>
        </div>

        <div style="display: flex; gap: 10px; align-items: center;">
            <button id="install-btn" class="header-btn hidden">Instaluj</button>
        </div>
    </div>
    
    <div id="month-header-stats" style="display: flex; justify-content: space-between; align-items: center; background: var(--primary-gradient); padding: 10px 15px; border-radius: 4px; margin: 0 10px 10px 10px; color: white; box-shadow: var(--shadow);">
        <div style="font-size: 13px; display: flex; align-items: center; gap: 10px;">
            <div>
                Stawka: <input type="number" id="hourly-rate" value="30" style="width: 45px; background: rgba(255,255,255,0.2); border: none; border-radius: 4px; padding: 2px 5px; color: white; font-weight: bold; font-size: 14px; text-align: center; outline: none;"> zł
            </div>
            <button id="fill-month-btn" style="background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.4); border-radius: 4px; padding: 3px 8px; color: white; cursor: pointer; font-size: 11px; font-weight: bold;">Pon-Pt</button>
        </div>
        <div style="text-align: right; line-height: 1.2;">
            <div style="font-size: 16px; font-weight: 700;" id="total-money">0 zł</div>
            <div id="total-hours-label" style="font-size: 11px; opacity: 0.9;">(0h)</div>
        </div>
    </div>

    <main class="calendar-container" id="main-calendar-view">
        <div class="weekdays">
            <div>Pon</div><div>Wto</div><div>Śro</div><div>Czw</div><div>Pią</div><div>Sob</div><div>Nie</div>
        </div>
        <div id="calendar-grid" class="calendar-grid">
            <!-- Dni kalendarza generowane przez JS -->
        </div>

        <div class="notes-section">
            <h3 style="font-size: 14px; margin-top: 0; margin-bottom: 10px; color: var(--primary-color); display: flex; justify-content: space-between; align-items: center;">
                <span>Notatki</span>
                <span id="selected-note-day-label" style="font-size: 11px; color: var(--text-muted); font-weight: normal; background: var(--bg-color); padding: 4px 8px; border-radius: 4px;">Wybierz dzień z kalendarza</span>
            </h3>
            <div class="add-note-form" style="display: flex; gap: 8px; margin-bottom: 15px;">
                <input type="hidden" id="note-day-hidden" value="1">
                <input type="text" id="note-text" placeholder="Wpisz treść notatki..." style="flex: 1; padding: 10px 12px; border-radius: 4px; border: 1px solid var(--border-color); outline: none; font-size: 13px; background: #f9f9f9; color: var(--text-color);">
                <button id="add-note-btn" style="background: var(--primary-gradient); color: white; border: none; padding: 0 18px; border-radius: 4px; font-weight: 700; cursor: pointer; box-shadow: var(--shadow); font-size: 18px;">+</button>
            </div>
            <div id="notes-list" class="notes-list">
                <!-- Notatki generowane z JS -->
            </div>
        </div>
    </main>

    <main class="calendar-container hidden" id="year-view-container">
        <div class="stats-bar" style="margin-bottom: 20px;">
            <div class="total-earnings" style="text-align: center; width: 100%; padding: 15px; background: var(--primary-gradient); color: white; border-radius: 4px; box-shadow: var(--shadow);">
                Suma roczna
                <div style="display: flex; align-items: baseline; justify-content: center; gap: 5px; margin-top: 5px;">
                    <strong id="year-total-money" style="font-size: 20px;">0 zł</strong>
                    <span id="year-total-hours" style="font-size: 13px; color: rgba(255,255,255,0.8); font-weight: 400;">(0h)</span>
                </div>
            </div>
        </div>
        <div id="year-grid" class="year-grid">
            <!-- Miesiące generowane z JS -->
        </div>
    </main>

    <!-- Floating Action Bar do wielokrotnego zaznaczania -->
    <div id="bulk-action-bar" class="hidden">
        <span id="selected-count">Zaznaczono: 0 dni</span>
        
        <div style="display: flex; gap: 8px; margin-bottom: 10px; width: 100%; justify-content: center;">
            <button class="preset-btn" data-val="8">8h</button>
            <button class="preset-btn" data-val="10">10h</button>
            <button class="preset-btn" data-val="12">12h</button>
        </div>

        <div class="bulk-inputs">
            <input type="number" id="bulk-hours" placeholder="Inna..." min="0" max="24" step="0.5">
            <div style="display: flex; flex-direction: column; gap: 5px;">
                <button id="apply-bulk">Wpisz</button>
                <button id="apply-bulk-done" style="background: var(--success-gradient);">+ Oznacz ✓</button>
            </div>
            <button id="cancel-bulk" class="cancel-btn">Anuluj</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
