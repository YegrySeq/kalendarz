<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kalendarz Pracy</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#007bff">
    <link rel="apple-touch-icon" href="icon.svg">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="app-header">
        <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
            <button id="install-btn" class="hidden" style="background: #28a745; color: white; border: none; padding: 8px 12px; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 12px;">📲 Instaluj</button>
            <div style="display: flex; gap: 5px; margin-left: auto;">
                <button id="export-btn" style="background: #6c757d; color: white; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; font-size: 12px;">💾 Zapisz (Eksport)</button>
                <label for="import-file" style="background: #6c757d; color: white; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; font-size: 12px;">📂 Wgraj (Import)</label>
                <input type="file" id="import-file" accept=".json" style="display: none;">
            </div>
        </div>
        <div class="month-selector">
            <button id="prev-month">&lt;</button>
            <h2 id="current-month-label">Wrzesień 2026</h2>
            <button id="next-month">&gt;</button>
        </div>
        <div class="stats-bar">
            <div class="rate-input">
                <label for="hourly-rate">Stawka/h:</label>
                <input type="number" id="hourly-rate" value="30" min="0" step="1">
                <span>zł</span>
            </div>
            <div class="total-earnings">
                Wypłata: <strong id="total-money">0</strong> zł
            </div>
        </div>
    </header>

    <main class="calendar-container">
        <div class="weekdays">
            <div>Pon</div><div>Wto</div><div>Śro</div><div>Czw</div><div>Pią</div><div>Sob</div><div>Nie</div>
        </div>
        <div id="calendar-grid" class="calendar-grid">
            <!-- Dni kalendarza generowane przez JS -->
        </div>
    </main>

    <!-- Floating Action Bar do wielokrotnego zaznaczania -->
    <div id="bulk-action-bar" class="hidden">
        <span id="selected-count">Zaznaczono: 0 dni</span>
        <div class="bulk-inputs">
            <input type="number" id="bulk-hours" placeholder="Godziny..." min="0" max="24" step="0.5">
            <button id="apply-bulk">Zapisz</button>
            <button id="cancel-bulk" class="cancel-btn">Anuluj</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
