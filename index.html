<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kalendarz Pracy</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#007bff">
    <link rel="apple-touch-icon" href="icon.svg">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div style="display: flex; justify-content: space-between; padding: 10px 15px; align-items: center;" id="month-header-top">
        <button id="toggle-view-btn" style="background: none; border: none; font-size: 14px; font-weight: 700; color: var(--primary-color); cursor: pointer;">📅 Rok</button>
        <div class="month-selector" style="display: flex; align-items: center; gap: 10px;">
            <button id="prev-month" style="background: none; border: none; font-size: 24px; color: var(--primary-color); cursor: pointer;">&lt;</button>
            <h2 id="current-month-label" style="font-size: 18px; margin: 0; font-weight: 700; color: var(--text-color);">Wrzesień 2026</h2>
            <button id="next-month" style="background: none; border: none; font-size: 24px; color: var(--primary-color); cursor: pointer;">&gt;</button>
        </div>
        <button id="install-btn" class="hidden" style="background: none; border: none; font-size: 18px; cursor: pointer;">📲</button>
    </div>
    
    <div id="month-header-stats" style="display: flex; justify-content: space-between; align-items: center; background: var(--primary-gradient); padding: 8px 15px; border-radius: 12px; margin: 0 10px 10px 10px; color: white; box-shadow: 0 4px 10px rgba(108, 92, 231, 0.2);">
        <div style="font-size: 12px; display: flex; align-items: center;">
            Stawka: <input type="number" id="hourly-rate" value="30" style="width: 40px; background: transparent; border: none; color: white; font-weight: bold; font-size: 14px; text-align: center; margin-left: 5px; outline: none;"> zł
        </div>
        <div style="text-align: right; line-height: 1.2;">
            <div style="font-size: 16px; font-weight: 700;" id="total-money">0 zł</div>
            <div id="total-hours-label" style="font-size: 11px; opacity: 0.9;">(0h)</div>
        </div>
    </div>

    <main class="calendar-container" id="main-calendar-view">
        <div class="weekdays">
            <div>Pon</div><div>Wto</div><div>Śro</div><div>Czw</div><div>Pią</div><div>Sob</div><div>Nie</div>
        </div>
        <div id="calendar-grid" class="calendar-grid">
            <!-- Dni kalendarza generowane przez JS -->
        </div>

        <div class="notes-section">
            <h3 style="font-size: 14px; margin: 15px 0 10px 0; color: var(--text-muted);">Notatki i Zmiany</h3>
            <div class="add-note-form" style="display: flex; gap: 5px; margin-bottom: 15px;">
                <select id="note-day-select" style="padding: 8px; border-radius: 8px; border: 1px solid var(--border-color); outline: none;"></select>
                <input type="text" id="note-text" placeholder="Wpisz notatkę (np. Na 8:00)..." style="flex: 1; padding: 8px; border-radius: 8px; border: 1px solid var(--border-color); outline: none; font-size: 13px;">
                <button id="add-note-btn" style="background: var(--primary-gradient); color: white; border: none; padding: 0 15px; border-radius: 8px; font-weight: 600; cursor: pointer;">Dodaj</button>
            </div>
            <div id="notes-list" class="notes-list">
                <!-- Notatki generowane z JS -->
            </div>
        </div>
    </main>

    <main class="calendar-container hidden" id="year-view-container">
        <div class="month-selector">
            <button id="prev-year">&lt;</button>
            <h2 id="current-year-label">2026</h2>
            <button id="next-year">&gt;</button>
        </div>
        <div class="stats-bar" style="margin-bottom: 20px;">
            <div class="total-earnings" style="text-align: center; width: 100%;">
                Suma roczna
                <div style="display: flex; align-items: baseline; justify-content: center; gap: 5px;">
                    <strong id="year-total-money">0 zł</strong>
                    <span id="year-total-hours" style="font-size: 12px; color: rgba(255,255,255,0.8); font-weight: 400;">(0h)</span>
                </div>
            </div>
        </div>
        <div id="year-grid" class="year-grid">
            <!-- Miesiące generowane z JS -->
        </div>
    </main>

    <!-- Floating Action Bar do wielokrotnego zaznaczania -->
    <div id="bulk-action-bar" class="hidden">
        <span id="selected-count">Zaznaczono: 0 dni</span>
        
        <div style="display: flex; gap: 8px; margin-bottom: 10px; width: 100%; justify-content: center;">
            <button class="preset-btn" data-val="8">8h</button>
            <button class="preset-btn" data-val="10">10h</button>
            <button class="preset-btn" data-val="12">12h</button>
        </div>

        <div class="bulk-inputs">
            <input type="number" id="bulk-hours" placeholder="Inna..." min="0" max="24" step="0.5">
            <div style="display: flex; flex-direction: column; gap: 5px;">
                <button id="apply-bulk">Wpisz</button>
                <button id="apply-bulk-done" style="background: var(--success-gradient);">+ Oznacz ✓</button>
            </div>
            <button id="cancel-bulk" class="cancel-btn">Anuluj</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
