<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kalendarz Pracy</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#007bff">
    <link rel="apple-touch-icon" href="icon.svg">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="top-actions">
        <button id="install-btn" class="hidden">📲 Instaluj</button>
        <div style="display: flex; gap: 10px; margin-left: auto;">
            <button id="export-btn">💾 Zapisz</button>
            <label for="import-file">📂 Wgraj</label>
            <input type="file" id="import-file" accept=".json" style="display: none;">
        </div>
    </div>
    
    <header class="app-header">
        <div class="month-selector">
            <button id="prev-month">&lt;</button>
            <h2 id="current-month-label">Wrzesień 2026</h2>
            <button id="next-month">&gt;</button>
        </div>
        <div class="stats-bar">
            <div class="rate-input">
                <label for="hourly-rate">Stawka/h:</label>
                <div>
                    <input type="number" id="hourly-rate" value="30" min="0" step="1">
                    <span>zł</span>
                </div>
            </div>
            <div class="total-earnings">
                Przewidywana wypłata
                <strong id="total-money">0 zł</strong>
            </div>
        </div>
    </header>

    <main class="calendar-container">
        <div class="weekdays">
            <div>Pon</div><div>Wto</div><div>Śro</div><div>Czw</div><div>Pią</div><div>Sob</div><div>Nie</div>
        </div>
        <div id="calendar-grid" class="calendar-grid">
            <!-- Dni kalendarza generowane przez JS -->
        </div>
    </main>

    <!-- Floating Action Bar do wielokrotnego zaznaczania -->
    <div id="bulk-action-bar" class="hidden">
        <span id="selected-count">Zaznaczono: 0 dni</span>
        
        <div style="display: flex; gap: 8px; margin-bottom: 10px; width: 100%; justify-content: center;">
            <button class="preset-btn" data-val="8">8h</button>
            <button class="preset-btn" data-val="10">10h</button>
            <button class="preset-btn" data-val="12">12h</button>
        </div>

        <div class="bulk-inputs">
            <input type="number" id="bulk-hours" placeholder="Inna..." min="0" max="24" step="0.5">
            <div style="display: flex; flex-direction: column; gap: 5px;">
                <button id="apply-bulk">Wpisz</button>
                <button id="apply-bulk-done" style="background: var(--success-gradient);">+ Oznacz ✓</button>
            </div>
            <button id="cancel-bulk" class="cancel-btn">Anuluj</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
